<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Capturar URL</title>
    <meta http-equiv=content-type content=“text/html; charset=UTF-8”>
    <style>
      body {
        width: 350px;
        counter-reset: myCounter;
        padding: 0;
        margin: 0;
      }
      .list-url {
        margin: 0;
        padding: 0;
        margin-bottom: 20px;
        
      }
      .list-url li {
        list-style-type: decimal;
        border-bottom: 1px dashed #333;
        white-space: nowrap;
        padding:5px;
        position: relative;
        margin-bottom: 5px;
        overflow: hidden;
        padding-left: 25px;
      }
      .list-url li:last-child {
        border-bottom: none;
      }
      .list-url li:before {
          counter-increment: myCounter;
          content: counter(myCounter);
          width: 20px;
          background-color: #FF5722;
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
      }
      .list-url li span {
        position: absolute;
        right: 0;
        background-color: #F44336;
        color: #fff;
        width: 20px;
        height: 100%;
        display: flex;
        align-items: center;
        top: -4px;
        text-align: center;
        justify-content: center;
        cursor: pointer;
      }
      #currentUrl,
      #storedUrl {
        overflow: hidden;
        white-space: nowrap;
      }
      #getStoredUrlButton {
        background-color: #131921;
        color: #fff;
        border: none;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        padding-right: 20px;
        transition: all ease-in 0.5s;
      }
      #getStoredUrlButton:hover {
        background-color: #1c2e46;
      }
      #getStoredUrlButton .name {
        font-weight: bold;
      }
    #getStoredUrlButton .count {
        position: absolute;
        color: #f08804;
        font-style: normal;
        font-weight: bold;
        left: 26px;
        top: 5px;
        font-size: 16px;
        width: 16px;
      }
      .group-button {
        display: flex;
        justify-content: space-between;
      }
      #clearButton {
        padding: 10px;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: bold;
        cursor: pointer;
        color: #5a5a5a;
      }
      .button-send {

        background-color: #8bc34a;
        color: #fff;
        border: none;
        padding: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: bold;
      }
      .button-copy {
        background-color: #2196F3;
        border: none;
        color: #fff;
        padding: 0 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .title-url {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 5px;

      }
      .container {
        padding: 20px;
      }
      .top {

        background-color: #131921;
        display: flex;
        padding: 10px;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 15px;
        font-weight: bold;
        gap: 10px;
      }
      .top span i {
        color: #ffa724;
        font-style: normal;
      }
    </style>
    <script src="popup.js"></script>
  </head>
  <body>

        <span>Produtos <i>Amazon</i></span>
    </div>
    <div class="container">

    <div style="display: flex;flex-direction: column;">

          <span>URL Corrente:</span>
      </h3>

        <div style="display: grid;grid-template-columns: auto 100px;gap: 15px;">
        <p id="currentUrl">Aguardando...</p>
        <button class="button-copy" id="copyButton">

      </div>
    </div>
